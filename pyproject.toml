[project]
name = "deauville"
version = "0.1.0"
description = "Management platform for the Deauville Festival du Rire"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.7.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
deauville = "cli:run_cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Instruct Hatchling to package the existing flat directory structure
[tool.hatch.build.targets.wheel]
packages = [
    "cli",
    "config",
    "helpers",
    "models",
    "repositories",
    "schemas",
]

# Include the root-level scripts in the build
[tool.hatch.build.targets.wheel.force-include]
"api.py" = "api.py"
"main.py" = "main.py"

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B"]